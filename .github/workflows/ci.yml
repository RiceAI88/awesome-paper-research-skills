name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON config and data
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          for path in ["config/ranking.json", "data/rankings.json"]:
              json.loads(Path(path).read_text(encoding="utf-8"))
              print(f"ok: {path}")
          EOF

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Frontend logic and production asset tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e
